[package]
name = "carapace-core"
version.workspace = true
edition.workspace = true

[lib]
name = "carapace_core"

[dependencies]
slotmap = "1.1"
arrayvec = "0.7"
nalgebra = "0.35"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
