[package]
name = "carapace-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carapace-core = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
slotmap = "1.1"

[dev-dependencies]
serde_json = "1"
