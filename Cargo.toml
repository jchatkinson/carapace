[workspace]
resolver = "2"
# The Python extension builds with maturin and needs a Python toolchain, so it is its own workspace.
exclude = ["py"]
members = ["core", "input", "wasm-bridge", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
