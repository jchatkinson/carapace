[package]
name = "carapace-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "carapace"
path = "src/main.rs"

[dependencies]
carapace-input = { path = "../input", features = ["schema"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1"
