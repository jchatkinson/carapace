[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "carapace-fe"
version = "0.1.0"
description = "Python interface to the Carapace finite-element engine"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
python-source = "python"
module-name = "carapace._carapace"
features = ["pyo3/extension-module"]
