[package]
name = "carapace-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_carapace"
crate-type = ["cdylib"]

[dependencies]
carapace-input = { path = "../input" }
pyo3 = { version = "0.26", features = ["abi3-py39"] }
serde_json = "1"
serde_path_to_error = "0.1"

[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
